<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти | Видео обучение по Photoshop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div id="navbar-placeholder"></div>

    <header class="text-white text-center py-4 custom-header">
        <div class="container py-2">
            <h1 class="h2 fw-bold mb-2">Контакти</h1>
            <p class="mb-0 text-light opacity-75">Връзка с катедрата и изпращане на запитвания</p>
        </div>
    </header>

    <main class="container my-5 flex-grow-1">
        <div class="row g-4 justify-content-center">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-4">
                    <h2 class="h4 fw-bold text-dark mb-4">Форма за обратна връзка</h2>
                    <form action="#" method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label small fw-semibold text-muted">Име и фамилия</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold text-muted">Електронна поща</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label small fw-semibold text-muted">Съобщение</label>
                            <textarea class="form-control" id="message" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-info w-100 fw-bold">Изпрати</button>
                    </form>
                </div>
            </div>
            <div class="col-md-5">
                <div class="card border-0 shadow-sm p-4 h-100">
                    <h2 class="h4 fw-bold text-dark mb-3">Академична структура</h2>
                    <p class="text-muted small mb-1"><strong>Университет:</strong> Университет по хранителни технологии (УХТ)</p>
                    <p class="text-muted small mb-1"><strong>Факултет:</strong> Технически факултет</p>
                    <p class="text-muted small mb-4"><strong>Катедра:</strong> Компютърни системи и технологии</p>
                    <hr>
                    <p class="text-muted small mb-0">Пловдив, България</p>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="components.js"></script>
</body>
</html>
